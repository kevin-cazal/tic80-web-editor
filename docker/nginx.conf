# The app is served under /runtime/tic80/latest/ — the path the workshop
# platform embeds it at (/runtime/<id>/<version>/, same origin as CTFd). Vite
# bakes that base into the dist (VITE_BASE in the Dockerfile), so the files
# live at that same path under the document root and no rewrite is needed.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Redirects stay relative: behind TLS-terminating ingress, nginx sees http.
  absolute_redirect off;

  # The platform shows this app in a same-origin iframe: SAMEORIGIN, not DENY.
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Standalone convenience (docker run): land on the app.
  location = / {
    return 302 /runtime/tic80/latest/;
  }

  # Exact match, so the bare path is not read as a version by the regex below
  # (which would redirect it to itself).
  location = /runtime/tic80/latest {
      return 301 /runtime/tic80/latest/;
  }

  # The URL says "latest", so it cannot promise unchanging content. Cache
  # policy by kind of file — every nested location restates the frame headers
  # because an add_header in a location replaces the inherited set.
  #
  # `^~` so the version-redirect regex below is not consulted for this prefix.
  location ^~ /runtime/tic80/latest/ {
    # Default, for tic80/tic80.{js,wasm} and everything else without a hash
    # in its name: always revalidate. nginx answers a 304 on the ETag, so
    # the 14 MB WASM is not downloaded again unless it changed.
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ /runtime/tic80/latest/index.html;

    # The SPA shell: never stored, a stale one would reference assets that
    # no longer exist.
    location = /runtime/tic80/latest/index.html {
      add_header Cache-Control "no-store" always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header X-Content-Type-Options nosniff always;
    }

    # Vite names these by content hash: a given URL never changes content.
    location /runtime/tic80/latest/assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header X-Content-Type-Options nosniff always;
    }
  }

  # Any other version of this runtime (a subject still pinning a commit sha)
  # goes to the one build this image carries.
  location ~ ^/runtime/tic80/[^/]+(/.*)?$ {
    return 302 /runtime/tic80/latest$1$is_args$args;
  }
}
